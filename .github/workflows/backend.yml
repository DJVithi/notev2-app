name: Backend CI

on:
  push:
    paths:
      - "notev2-backend/**"
  pull_request:
    paths:
      - "notev2-backend/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Maven Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Tests ausführen
        
        env:
          JWT_SECRET: aVeryLongRandomSecretKeyForJwtThatIsDefinitelySecure123456
        run: |
          cd notev2-backend
          chmod +x mvnw
          ./mvnw test